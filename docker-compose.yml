name: satview

services:
  timescaledb:
    image: timescale/timescaledb:latest-pg14
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - timescaledb_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  python:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ./src/calculation_server:/app/src
    depends_on:
      timescaledb:
        condition: service_healthy
    environment:
      - DATABASE_URL=${DB_DSN}
      - PYTHONUNBUFFERED=1
      - N2YO_API_KEY=${N2YO_API_KEY}
    tty: true
    stdin_open: true

volumes:
  timescaledb_data: